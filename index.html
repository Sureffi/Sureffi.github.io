    * { box-sizing: border-box; }
    html { background: var(--bg); overflow-x: clip; }
    html.walled { background: #000; }   /* past the wall's foot the floor goes on, black */
    html, body { min-height: 100%; }
    body {
      margin: 0; position: relative;

    ::selection { background: var(--accent2); color: #000; }

    a, a:visited { color: var(--accent); text-decoration: none;

    a:hover { color: var(--fg); text-shadow: 0 0 9px rgba(111, 227, 214, .35), var(--ground); }

    /* the wall stands at the head of the page, one screen of it, and the
       floor runs on under all the rest. scroll and the view pans down: the
       floor comes up with the page, the wall, further off, lags and sinks
       behind the floor's edge */
    #wall {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100%;
      pointer-events: none;
      z-index: -2; image-rendering: pixelated;
    }

    /* the page: the masthead on the wall, the rest on the floor */
    #page {
      position: relative; z-index: 2;
      width: 100%; max-width: min(720px, calc(100vw - 2 * var(--gut)));
      margin: 0 auto;
      padding: 0 var(--gut) clamp(120px, 22vh, 220px);
    }

    /* transmission anatomy: resolved ink ← burn point ← static */
    .hot { color: var(--rain); text-shadow: 0 0 7px rgba(42, 169, 168, .55); }
    .raw { color: rgba(42, 169, 168, .30); text-shadow: none; }

    /* the masthead is a whole screen, centered on the curtain, not the
       window: the dust takes the bottom sixth */
    .masthead {
      position: relative; min-height: 100svh; padding-bottom: 14svh;
      display: flex; flex-direction: column; justify-content: center;
      text-align: center;
      width: 100vw; margin-left: calc(50% - 50vw);   /* the name outgrows the column */
      user-select: none; pointer-events: none;       /* it's the wall's: clicks go through */

    #title {
      margin: 0; line-height: 1.1; letter-spacing: .04em;

    .boot #title, .boot .tagline { visibility: hidden; }
    .gate #wall, .gate #page { visibility: hidden; }
    .walled #title { color: transparent; text-shadow: none; }
    .eaten { opacity: 0; }

    .block p { margin: 0; }
    .section-head {
      margin: 0 0 .9em; font-size: 24px; font-weight: normal;
      letter-spacing: .12em; text-shadow: var(--ground);
    }
    .note { color: var(--dim); }

    .exhibit:last-of-type { border-bottom: 1px solid var(--hair); }

            <h1>DRAWER</h1>
            <p class="one">A <code>```dot</code> fence in a Claude Code reply becomes a drawing. In place, while the reply is still streaming. One binary, nothing else running.</p>
          </div>

        <div class="more">
<video class="shot" src="wares/img/drawer.mp4" poster="wares/img/drawer-poster.png" muted loop playsinline autoplay></video>
  <p class="cap">a live session. the model writes DOT, you see the picture.</p>

  
  <h2>what it is</h2>
  <p>One Go binary, installed as a Claude Code plugin. It hooks the reply display. When a <code>```dot</code> fence arrives, it lays the graph out with graphviz and paints it into the terminal where the fence sits. Graphviz, the type and the painting are all inside the binary. Nothing else to install.</p>

  <h2>what it does</h2>
  <ul>
    <li>In kitty or ghostty, through tmux too, the graph is a picture in the reply.</li>
    <li>Anywhere else it's drawn in box characters, which every terminal draws with its own hand.</li>
    <li>Draws as the reply arrives. The graph grows with the sentence.</li>
    <li><code>drawer -doctor</code> says what this terminal gets and why.</li>
  </ul>

  <img class="shot" src="wares/img/drawer-cells.png" alt="a graph drawn in box characters">
  <p class="cap">box drawing, where a terminal can't show pictures.</p>

  <h2>install</h2>
<pre>/plugin marketplace add sureffi/drawer
/plugin install drawer@drawer</pre>
  <p>Then ask for a graph. Linux and macOS.</p>

  <h2>settings</h2>
  <p>Three environment variables, set for <code>claude</code> in <code>settings.json</code> or the shell.</p>
  <ul>
    <li><code>DRAWER_RENDER</code> forces a drawing: <code>auto</code>, <code>pixels</code> or <code>cells</code>.</li>
    <li><code>DRAWER_THEME</code> names a theme file.</li>
    <li><code>DRAWER_TEE</code> records every payload the hook receives, for <code>drawer -deltas</code> to replay.</li>
  </ul>
  <div class="links"><a href="https://github.com/Sureffi/drawer">source</a><a href="https://github.com/Sureffi/drawer#settings">readme</a></div>
  
        </div>

      <header class="plate" id="agentsdk" data-name="agentSDK.NET" data-sub="nervous · neural link"><i class="cm"></i>
        <div class="body">
          <div class="text">
            <p class="kind">nervous · neural link</p>
            <h1>AGENTSDK.NET</h1>
            <p class="one">The Claude Agent SDK for .NET. Drives the <code>claude</code> binary over stream-json, on the account that binary is logged into. No API key.</p>
          </div>
          <div class="bay"><canvas class="sprite" data-piece="cable" data-hue="6fe3d6"></canvas><i class="floor"></i></div>
        </div>
        <dl class="spec">
          <div><dt>when</dt><dd>2026</dd></div>
          <div><dt>stack</dt><dd>c# · net10.0</dd></div>
          <div><dt>runs on</dt><dd>the claude binary</dd></div>
          <div><dt>state</dt><dd>1.0.0 · MIT</dd></div>
          <div class="wx"><dt>source</dt><dd><a href="https://github.com/Sureffi/agentSDK.NET">github.com/Sureffi/agentSDK.NET</a></dd></div>
        </dl>
        <div class="more">

  <h2>what it is</h2>
  <p>One namespace, <code>Claude.Agent</code>. A client, a live session, and a second client over the sessions the binary keeps on disk. Options for how the binary is reached and for what one call asks of it. Hooks and a permission callback as delegates. In-process MCP tools. Typed models built off the wire, with a factory for your own tests. Shaped after the Azure SDK design guidelines for .NET.</p>

  <h2>what it does</h2>
  <ul>
    <li>Runs an agent loop from .NET with the session as the credential.</li>
    <li>Carries tool use both directions: the binary's tools typed for you, your tools served to it in-process over MCP.</li>
    <li>Resumes sessions the binary already has on disk.</li>
    <li>One line on the generic host. Works without a container the same way.</li>
  </ul>

  <h2>install</h2>
  <p>Not on nuget. <code>dotnet pack</code> at the root gives you the package for a folder feed, or reference the project.</p>
<pre>&lt;PackageReference Include="Claude.Agent" Version="1.0.0" /&gt;
&lt;PackageReference Include="Microsoft.Extensions.Hosting" Version="10.0.12" /&gt;</pre>
<pre>builder.Services.AddClaudeAgentClient(o =&gt; o.Defaults.Model = "haiku");</pre>
  <p>Needs .NET and a <code>claude</code> on PATH that's logged in.</p>
  <div class="links"><a href="https://github.com/Sureffi/agentSDK.NET">source</a></div>

  <script>
(function () {
  /* ── the blackwall ────────────────────────────────────────────────────────
     the wall IS the data. a standing curtain of teal strands hanging from
     the dark, weather drifting behind it (rain, the deep indigo), a furnace
     patch that wanders and burns, and the things on the far side pressing
     close enough to glow. it stands on a floor of dust where small dark
     watchers have gathered. clicks tear, slices shear sideways. */
  const FW = 480, FH = 270, MAX = 36;
  const HOR = 226;                   // the seam where the wall meets the dust
  let CH = FH;                       // the canvas: the wall's screen, then the floor as far as the page goes
  const N = FW * FH;
  const cv = document.getElementById('wall');
  const ctx = cv.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false,
                                        premultipliedAlpha: false, desynchronized: true });
  let cur = new Uint8Array(N);
  let nxt = new Uint8Array(N);
  let cur32 = new Uint32Array(cur.buffer);  // 4-px windows over the same bytes:
  let nxt32 = new Uint32Array(nxt.buffer);  // most of the wall is dark, and dark skips in bulk
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // pocket xorshift — Math.random is too dear at 130k pixels a frame
  let rs = (Math.random() * 0xffffffff) | 0 || 0x2af5e6;
  function rnd() { rs ^= rs << 13; rs ^= rs >>> 17; rs ^= rs << 5; return (rs >>> 0) / 4294967296; }

  /* two waters, eight mixtures: the rain ramp (black → teal → white-teal)
     and the deep one (black → indigo → periwinkle-white). every pixel picks
     its mixture from the weather; the heat layer always burns pure rain. */
  const HOTS  = [[0,[0,0,0]],[.22,[4,18,20]],[.45,[16,72,72]],[.65,[42,169,168]],
                 [.80,[111,227,214]],[.92,[180,242,232]],[1,[220,248,244]]];
  const COOLS = [[0,[0,0,0]],[.22,[8,8,28]],[.45,[32,38,110]],[.65,[74,85,200]],
                 [.80,[154,166,255]],[.92,[200,210,255]],[1,[235,240,255]]];
  function rampAt(stops, t) {
    let a = stops[0], b = stops[stops.length - 1];
    for (let s = 0; s < stops.length - 1; s++)

      rasterize(t, (x, y, lv, hu) => stampPx(x, y, lv, hu, true));
    }
    if (flock.length) flockFrame(now);
  }

  /* ── the answer ──
     they eat: each locks a bent line onto a code (row first or column
     first), the code corrupts, and is pulled up the line into it, and the
     wall shatters where it was; nearest first, several lines out at once.
     when the last is inside the wall freezes, and they link: a repo each,
     hopping through it, packets shuttling between them. then they take
     their places round the name and link one last time, and hold. a flash,
     and it's another generation of the wall, later; they're back beyond
     it, a glow somewhere that fades, and the name accrues out of the rain,
     one drop at a time. */
  let flock = [], flockDone = null, nameT = null;
  let shutAt = 0, shuttles = [], trail = [], linkPk = [], pkAt = 0, impT0 = 0, restT0 = 0, gone = false, faintT = -1e9;
  let impact = 0, namePx = null;
  const ping = apps.map(() => -1e9);
  const LINKS = [[1, 2], [2, 0], [0, 1]], LINK = 2600;
  const GLYPHS = Object.keys(FONT);
  function glyphPx(ch, x, y, fn) {
    const g = FONT[ch]; if (!g) return;
    for (let k = 0; k < 35; k++) if (g.charCodeAt(k) === 49) fn(x + k % 5, y + (k / 5 | 0));
  }
  function lpt(x0, y0, x1, y1, hx, u) {              // the point u px along the line: straight (hx null),
                                                      // or bent, row first (hx) or column first
    if (hx === null) {
      const L = Math.hypot(x1 - x0, y1 - y0), f = L ? Math.min(1, u / L) : 1;
      return [x0 + (x1 - x0) * f, y0 + (y1 - y0) * f];
    }
    const L1 = hx ? Math.abs(x1 - x0) : Math.abs(y1 - y0);
    if (u <= L1) {
      const f = L1 ? u / L1 : 1;
      return hx ? [x0 + (x1 - x0) * f, y0] : [x0, y0 + (y1 - y0) * f];
    }
    const L2 = hx ? Math.abs(y1 - y0) : Math.abs(x1 - x0), f = L2 ? Math.min(1, (u - L1) / L2) : 1;
    return hx ? [x1, y0 + (y1 - y0) * f] : [x0 + (x1 - x0) * f, y1];
  }
  function dot(x, y, lv, hu, halo) {
    x |= 0; y |= 0;
    if (x >= 0 && x < FW && y >= 0 && y < HOR) stampPx(x, y, lv, hu, halo);
  }
  function head(x, y) {                               // a packet's hot 2×2 head
    dot(x, y, 36, 7, false); dot(x + 1, y, 36, 7, false); dot(x, y + 1, 36, 7, false); dot(x + 1, y + 1, 36, 7, false);
  }
  function drawPacket(at, u) {                        // the head and a short hard tail, u px along at
    head(...at(u));
    for (let tr = 1; tr < 4; tr++) { const [x, y] = at(Math.max(0, u - tr * 2)); dot(x, y, 26 - tr * 5, 7, false); }
  }
  const ends = (a, b) => [appC[a][0] | 0, appC[a][1] | 0, appC[b][0] | 0, appC[b][1] | 0];

  function migrate(ids, t) {
    /* the codes: every run of glyphs between spaces is one bite */
    const units = [];
    for (const id of ids) {
      const s = texts.get(id); if (!s) continue;
      texts.delete(id);
      const str = s.s.toUpperCase(), n = Math.min(s.n ?? str.length, str.length);
      let u = null;
      for (let i = 0; i < n; i++) {
        const ch = str[i], lv = s.lv ? s.lv[i] : s.lvl, hu = s.hu ? s.hu[i] : 0;
        if (!FONT[ch] || !lv) { u = null; continue; }
        if (!u) units.push(u = { ch: [], y: s.y, px: 0 });
        u.ch.push({ ch, x: s.x + i * CELL, lv, hu });
        glyphPx(ch, 0, 0, () => u.px++);
      }
    }
    nameT = { ...t, x: Math.round(t.x), y: Math.round(t.y) };
    if (!units.length) { huntEnd(); return Promise.resolve(); }
    const now = performance.now();

    const per = apps.map(() => 0), queue = apps.map(() => []);
    for (const u of units) {
      u.cx = (u.ch[0].x + u.ch[u.ch.length - 1].x + 5) / 2; u.cy = u.y + 3;
      let k = 0, best = 1e9;
      for (let q = 0; q < apps.length; q++) {
        const d = Math.hypot(appC[q][0] - u.cx, appC[q][1] - u.cy) * (.6 + rnd() * .9) / apps[q].sc;
        if (d < best) { best = d; k = q; }
      }
      u.k = k; per[k] += u.px; queue[k].push(u);
    }
    const most = Math.max(...queue.map(q => q.length));
    const gap = Math.max(40, Math.min(110, 1000 / most));
    queue.forEach((q, k) => {
      q.sort((a, b) => Math.hypot(appC[k][0] - a.cx, appC[k][1] - a.cy) -
                       Math.hypot(appC[k][0] - b.cx, appC[k][1] - b.cy));
      q.forEach((u, j) => { u.tl = now + 200 + k * 60 + j * gap * (.8 + rnd() * .4); u.hx = rnd() < .5; u.ph = 0; });
    });
    flock = units; flock.per = per;
    linkPh = 0; impT0 = restT0 = 0; shuttles = []; charge.hold = 0;
    lively(9000);
    return new Promise(res => { flockDone = res; });
  }

  const EXT = 70, BITE = 80, PULL = .8;               // line out, corruption, px/ms home
  function line(ax, ay, bx, by, hx, reach, lv) {
    for (let d = 0; d < reach; d++) { const [x, y] = lpt(ax, ay, bx, by, hx, d); dot(x, y, lv, 7, false); }
  }
  function linkLines(lv) {                            // all three, whole
    for (const [a, b] of LINKS) {
      const [ax, ay, bx, by] = ends(a, b);
      line(ax, ay, bx, by, null, Math.hypot(bx - ax, by - ay), lv);
    }
  }
  function flockFrame(now) {
    let eating = 0;
    const taken = apps.map(() => 0);
    for (const u of flock) {                             /* act two: they eat */
      if (u.ph === 3) { taken[u.k] += u.px; continue; }
      eating++;
      const ex = appC[u.k][0] | 0, ey = appC[u.k][1] | 0;
      if (now < u.tl) {                                  // still in the grid
        for (const c of u.ch) glyphPx(c.ch, c.x, u.y, (x, y) => dot(x, y, c.lv, c.hu, true));
        continue;
      }
      const L = Math.abs(u.cx - ex) + Math.abs(u.cy - ey);   // bent: the two legs
      const f = now - u.tl;
      if (f < EXT + BITE) {                              // locked: the line runs out, the code corrupts
        line(ex, ey, u.cx, u.cy, u.hx, f < EXT ? L * f / EXT : L, 22);
        const hot = f >= EXT;
        for (const c of u.ch)
          glyphPx(hot || rnd() < .3 ? GLYPHS[(rnd() * GLYPHS.length) | 0] : c.ch, c.x, u.y,
                  (x, y) => dot(x, y, hot ? 33 : c.lv, hot ? 7 : c.hu, true));
        continue;
      }
      if (!u.ph) {                                       // taken: the wall shatters where it was
        u.ph = 1; u.dur = L / PULL; u.t0 = now;
        shatter(u.cx, u.cy, 6 + (u.ch[u.ch.length - 1].x - u.ch[0].x) / 2 + rnd() * 3, 120 + rnd() * 40);
        spawnSlice(u.cy, now);
      }
      const q = (now - u.t0) / u.dur;                  // pulled home; the line retracts behind it
      if (q >= 1) { u.ph = 3; eating--; taken[u.k] += u.px; continue; }
      const back = L * (1 - q);
      line(ex, ey, u.cx, u.cy, u.hx, back, 22);
      head(...lpt(ex, ey, u.cx, u.cy, u.hx, back));
    }

    if (!eating && !linkPh && !impT0) {                  /* act three: the wall freezes, they link */
      huntEnd();
      linkPh = 1; linkT0 = now; shutAt = now + 380;
      for (const e of apps) e.st.next = now + 120 + rnd() * 200;
    }
    const f = now - linkT0;
    if (linkPh === 1) {
      if (now > shutAt && f < LINK - 200) {              // traffic between repos, quickening
        const [a, b] = LINKS[(rnd() * 3) | 0], rev = rnd() < .5;
        shuttles.push({ a: rev ? b : a, b: rev ? a : b, t0: now });
        shutAt = now + Math.max(18, 110 - f * .05);
      }
      if (f >= LINK) { linkPh = 2; for (const e of apps) e.st.next = 0; }
    }
    for (let i = shuttles.length - 1; i >= 0; i--) {
      const sh = shuttles[i];
      const [ax, ay, bx, by] = ends(sh.a, sh.b), at = w => lpt(ax, ay, bx, by, null, w);
      const L = Math.hypot(bx - ax, by - ay), q = (now - sh.t0) / (L / 1.1);
      if (q >= 1) { ping[sh.b] = now; shuttles.splice(i, 1); continue; }
      const u = q * L, [px] = at(u);
      if (sh.lx == null || (px | 0) !== (sh.lx | 0)) {
        if (sh.lx != null) {                             // the code under it, rewritten
          wake(sh.lx, px, 4, 45);
          for (let d = sh.lu; d < u; d += 3) { const [tx, ty] = at(d); trail.push({ x: tx | 0, y: ty | 0, t: now }); }
        }
        sh.lx = px; sh.lu = u;
      }
      drawPacket(at, u);
    }
    for (let i = trail.length - 1; i >= 0; i--) {         // a flash where it passed, going out
      const T = trail[i], a = 1 - (now - T.t) / 90;
      if (a <= 0 || !linkPh) { trail.splice(i, 1); continue; }
      dot(T.x, T.y, (8 + 20 * a) | 0, T.h || 0, false);
      dot(T.x, T.y + 1, (4 + 12 * a) | 0, T.h || 0, false);
    }

    /* the last link: in their places, all three at once, slower; then
       nothing moves while it builds. then the impact, the wall restarts,
       and the name comes out of it, slow. */
    let done = false;
    const g = f - LINK;
    if (linkPh === 2 && !impT0) {
      if (g > 300) {
        /* the link is traffic: packets both ways down the paths, quickening
           as it builds, until they pack into one solid line. */
        const s0 = g - 300, hold = Math.max(0, (g - 500) / 600);
        const solid = Math.pow(Math.max(0, (hold - .35) / .65), 1.5);
        if (solid) linkLines((6 + 30 * solid) | 0);
        if (s0 < 40) pkAt = now;
        while (pkAt <= now) {
          linkPk.push({ j: (rnd() * 3) | 0, rev: rnd() < .5, t0: pkAt, v: .5 + 1.6 * hold });
          pkAt += Math.max(5, 65 * Math.pow(1 - hold, 1.6));
        }
        for (let i = linkPk.length - 1; i >= 0; i--) {
          const P = linkPk[i], [a, b] = LINKS[P.j];
          const [s, t] = P.rev ? [b, a] : [a, b];
          const ax = appC[s][0], ay = appC[s][1], bx = appC[t][0], by = appC[t][1];
          const L = Math.hypot(bx - ax, by - ay), u = (now - P.t0) * P.v;
          if (u >= L) { ping[t] = now; linkPk.splice(i, 1); continue; }
          drawPacket(w => lpt(ax, ay, bx, by, null, w), u);
        }
        if (s0 < 280) ping.fill(now);
        charge.hold = 1 + hold * .5;
        if (g >= 1100) { impT0 = now; lively(3000); }
      }
    }
    if (impT0) {
      const h = now - impT0;
      impact = h < 60 ? 1 : 0;
      if (h < 60) {                                        // the frame holds what it hit
        linkLines(36);
      } else if (!restT0) {                                // and it's another wall
        restT0 = now; linkPh = 0; linkA = 0; gone = true; faintT = now;
        shuttles = []; linkPk = []; charge.fill(0);
        reseed();
      }
    }
    if (restT0) {
      /* the name, one drop at a time: every pixel of it keeps a little of
         whatever light falls through it. nobody writes it; it accrues. */
      if (!namePx) { namePx = []; rasterize({ ...nameT, lvl: 1 }, (x, y) => namePx.push({ x, y, a: 0 })); }
      const dtn = Math.min(50, now - (namePx.t || now)); namePx.t = now;
      let full = 0, sum = 0;
      for (const q of namePx) {
        sum += q.a;
        if (q.a < 1) {
          const i = q.y * FW + q.x, vm = vmod[(q.y + colVi[q.x]) & 255];
          const drop = cur[i] > 6 ? cur[i] / 36 * .14 : 0;               // a drop passing leaves most
          const weave = ((cb[q.x] * vm) >> 8) > 120 ? .007 : 0;        // the bright dash leaves some
          q.a = Math.min(1, q.a + (drop + weave + .0022) * dtn / 16.7);
        }
        if (q.a >= 1) full++;
        if (q.a > .02) stampPx(q.x, q.y, (q.a * 32) | 0, 0, q.a > .45);
      }
      if (nameT.onFill) nameT.onFill(sum / namePx.length);
      if (full >= namePx.length * .985) done = true;
    }
    for (let k = 0; k < apps.length; k++) {
      const held = impT0 ? 0 : charge.hold || (linkPh ? 1 : flock.per[k] ? taken[k] / flock.per[k] : 0);
      charge[k] = held + 1.2 * Math.exp(-(now - ping[k]) / 110);
    }
    if (done) {
      flock = []; shuttles = []; charge.fill(0); charge.hold = 0;
      linkPh = 0; impT0 = restT0 = 0; gone = false; impact = 0; namePx = null;
      const d = flockDone; flockDone = null;
      if (d) d();
    }
  }

  /* no glass, no wall: the page stands on its own */
  measure();
  try { if (ctx) glass = makeGlass(); } catch (e) { console.warn(e); }
  if (!glass) {
    ctx?.getExtension('WEBGL_lose_context')?.loseContext();
    document.documentElement.classList.remove('walled', 'boot');
    cv.remove();
    return;
  }
  addEventListener('blur',  () => { blurred = true; });
  addEventListener('focus', () => { blurred = false; });
  addEventListener('resize', measure);
  new ResizeObserver(measure).observe(cv);

  /* the wall's verbs, for the page below */
  window.deck = window.deck || {};
  window.deck.wall = {
    FW, FH, CELL,
    tear,
    write: (id, t) => {              // put words on the wall (wall px, top-left)
      texts.set(id, { ...t, x: Math.round(t.x), y: Math.round(t.y) });
      lively(800);
    },
    erase: id => { texts.delete(id); },
    melt: id => {                    // the words go back into the rain
      const t = texts.get(id); if (!t) return;
      texts.delete(id);
      const drip = .2 / Math.max(1, ((t.sx || 1) * (t.sy || 1)) / 3);
      rasterize(t, (x, y, lv) => {
        const i = y * FW + x;
        if (lv > cur[i]) cur[i] = lv;
        if (rnd() < drip) risers.push({ x, y, v: -(.35 + rnd() * 1.2), heat: lv,
                                      gap: 0, life: 50 + ((rnd() * 90) | 0) });
      });
      lively(1600);
    },
    migrate, hunt,
    screenToWall: s2w,
    lag: () => lag(KW) * rowPx,      // css px the wall trails the page by
    ink: setInks,                    // the page registers its living lines
    absorb: absorbRect,              // a spoken line, taken (screen-px rect)
    look: (px, py) => {              // the cursor passes; the wall looks there
      const [x, y] = s2w(px, py);
      if (y >= FH) return;           // down on the floor, past its sight
      att.tx = x; att.ty = y;
      att.hold = performance.now() + 2600;
      lively(1400);
    },
    gather,
    set state(m) { mode = m; },
  };

  weather(0); pressApparitions(0);   // the wall is already there when you arrive
  requestAnimationFrame(frame);
})();

  /* ── the homepage rides on the wall ──────────────────────────────────────
     register the masthead as ink, resolve the headings out of static, and
     let hands at the wall: it looks where the cursor is, a click shatters
     it. the engine above does the burning; this only wires you in. */
  (function () {
    if (!window.deck || !deck.wall) return;      // no wall: plain page
    const W = deck.wall;
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function syncInk() { W.ink([...document.querySelectorAll('#page [data-clear]')]); }

    /* transmissions: text resolves out of static, left to right */
    const pick = a => a[(Math.random() * a.length) | 0];
    const NOISE = '░▒▓█▚▞▙▟▛▜╬╪╫≡§Ø¤×#%&@';
    const ng = () => pick(NOISE);
    const DECODE_MS = 55;             // ms each glyph takes to resolve — higher = slower
    function decodeIn(el, delay, per = DECODE_MS) {
      const text = el.dataset.text;
      const gen = el._gen = (el._gen || 0) + 1;   // a newer decode or an eating cancels this one
      if (still || !text) { el.textContent = text; return; }
      const res = document.createElement('span');
      const hot = document.createElement('span'); hot.className = 'hot';
      const raw = document.createElement('span'); raw.className = 'raw';
      el.textContent = '';
      el.append(res, hot, raw);
      const t0 = performance.now() + delay;
      (function step() {
        if (!el.isConnected || el._gen !== gen) return;
        const k = Math.max(0, Math.min(text.length, ((performance.now() - t0) / per) | 0));
        if (k >= text.length) { el.textContent = text; return; }
        res.textContent = text.slice(0, k);
        const hn = Math.min(3, text.length - k);
        let h = '', r = '';
        for (let i = k; i < k + hn; i++) h += text[i] === ' ' ? ' ' : ng();
        for (let i = k + hn; i < text.length; i++) r += text[i] === ' ' ? ' ' : ng();
        hot.textContent = h; raw.textContent = r;
        requestAnimationFrame(step);
      })();
    }

    /* the same line, accrued alongside the name: each glyph comes up out of
       nothing at its own point of the fill, raw → hot → resolved */
    /* the rect of the words themselves, not the block they sit in */
    function textRect(el) {
      const r = document.createRange(); r.selectNodeContents(el);
      return r.getBoundingClientRect();
    }
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    /* ── the breach ──
       the wall shows its code matrix in its own light. a highlight walks
       row, column, row, uploading the sequence into the buffer. the
       others eat the code, link up, and link once more;
       a flash, the wall is reseeded, and the name comes out of it. once
       per visit; any key or click hurries it. */
    const CODES = ['1C', 'BD', '55', 'E9', '7A', 'FF'];
    let hurry = false;
    const hurryUp = () => { hurry = true; };
    const wait = ms => hurry ? null : sleep(ms);
    const widthOf = s => s.length * W.CELL - 1;
    const cue = n => dispatchEvent(new CustomEvent('wallcue', { detail: n }));   // the breach tells the room where it is; sound listens

    async function typeIn(id, t, msPer) {
      for (let n = 1; n < t.s.length && !hurry; n++) {
        W.write(id, { ...t, n }); cue('type');
        await sleep(msPer);
      }
      W.write(id, t);
    }

    let booting = false;
    async function runBreach() {
      booting = true;
      W.state = 'working';                         // the wall runs hot while it's breached
      cue('begin');
      addEventListener('keydown', hurryUp);
      addEventListener('pointerdown', hurryUp);

      const r = textRect(title), mx = (r.left + r.right) / 2, my = (r.top + r.bottom) / 2;
      const [cx, cy] = W.screenToWall(mx, my);

      /* the matrix, with a solvable path laid in: row 0 → its column → a row */
      const seq = [pick(CODES), pick(CODES), pick(CODES)];
      const grid = [...Array(5)].map(() => [...Array(5)].map(() => pick(CODES)));
      const c0 = (Math.random() * 5) | 0, r1 = 1 + ((Math.random() * 4) | 0);
      const c2 = (c0 + 1 + ((Math.random() * 4) | 0)) % 5;
      const path = [[0, c0], [r1, c0], [r1, c2]];
      path.forEach(([pr, pc], k) => { grid[pr][pc] = seq[k]; });
      const picked = new Set(), buf = [];

      const rowW = widthOf('1C  1C  1C  1C  1C');
      const gx = cx - rowW / 2, gy = cy - 27;
      const head = s => ({ s, x: cx - widthOf(s) / 2, y: gy - 17, lvl: 30 });

      function drawGrid(active, at, flash) {
        for (let gr = 0; gr < 5; gr++) {
          const s = grid[gr].join('  '), lv = [], hu = [];
          for (let gc = 0; gc < 5; gc++) {
            const on = active && (active.row ? gr === active.i : gc === active.i);
            let L = on ? 28 : 13, H = 0;
            if (picked.has(gr * 5 + gc)) L = on ? 12 : 7;
            if (at && at[0] === gr && at[1] === gc) { L = flash ? 36 : 31; H = flash ? 0 : 7; }
            lv.push(L, L, 0, 0); hu.push(H, H, 0, 0);
          }
          W.write('g' + gr, { s, x: gx, y: gy + gr * 11, lv, hu });
        }
      }
      function drawBuffer() {
        const s = 'buffer ' + [0, 1, 2].map(k => buf[k] || '__').join('  ');
        const lv = [...s].map((_, i) => i < 7 ? 16 : buf[((i - 7) / 4) | 0] ? 29 : 12);
        const hu = [...s].map((_, i) => i < 7 ? 0 : 7);
        W.write('buf', { s, x: gx, y: gy + 5 * 11 + 6, lv, hu });
      }

      await wait(450);                             // the wall first, alone
      await typeIn('head', head('breach protocol'), 24);
      for (let gr = 0; gr < 5; gr++) {             // the matrix surfaces row by row
        drawGrid(null);
        for (let k = gr + 1; k < 5; k++) W.erase('g' + k);
        cue('row'); await wait(70);
      }
      drawGrid({ row: true, i: 0 });
      drawBuffer();
      await wait(380);

      let active = { row: true, i: 0 };
      for (let k = 0; k < 3; k++) {
        const [pr, pc] = path[k];
        const to = active.row ? pc : pr;
        for (let j = 0; j <= to; j++) {            // the cursor walks the line
          drawGrid(active, active.row ? [pr, j] : [j, pc]);
          cue('step'); await wait(105);
        }
        await wait(170);
        drawGrid(active, [pr, pc], true);
        cue('pick'); await wait(80);
        buf[k] = grid[pr][pc];
        grid[pr][pc] = '[]';
        picked.add(pr * 5 + pc);
        active = { row: !active.row, i: active.row ? pc : pr };
        drawGrid(k < 2 ? active : null);
        drawBuffer();
        await wait(140);
      }

      W.write('head', { ...head('breached'), lvl: 34 });
      cue('breached'); await wait(420);
      const ids = ['head', 'g0', 'g1', 'g2', 'g3', 'g4', 'buf'];
      if (hurry) { cue('melt'); for (const id of ids) W.melt(id); }
      else {
        cue('migrate');
        const geo = nameGeom(), nw = widthOf(title.dataset.text) * geo.sx;
        W.hunt(geo.x + nw / 2, nw / 2);
        W.gather(mx, my, 3600);
        await sleep(300);
        await W.migrate(ids, { s: title.dataset.text, ...nameGeom() });
      }
      settleName();
      cue('land');
      W.state = 'hold';                            // the motion stops. the name stands alone in the held rain
      await wait(1100);
      tagline.style.visibility = 'visible';        // then the line, one glyph at a time
      cue('line'); decodeIn(tagline, 0);
      await sleep(tagline.dataset.text.length * DECODE_MS + 600);
      document.documentElement.classList.remove('boot');   // the console arms press start on this
      tagline.style.visibility = '';

      removeEventListener('keydown', hurryUp);
      removeEventListener('pointerdown', hurryUp);
      try { sessionStorage.setItem('booted', '1'); } catch (e) {}
      booting = false;
      checkEat();
    }
    /* the show again, in place: the name goes, the title is hidden as on a cold load, and the breach runs. no reload,
       so a page that has had a key keeps its voice. */
    W.replay = async () => {
      if (booting || still || scrollY > innerHeight * .16) return;
      hurry = false; nameGen++; name = null; W.erase('name');
      document.documentElement.classList.add('boot');
      await runBreach();
    };

    const title = document.getElementById('title');
    const tagline = document.querySelector('.tagline');
    const mast = [title, tagline];

    /* the name is written in the wall's own face. the h1 keeps the place
       and the words for readers that can't see light; the wall sets it,
       square on any screen, as wide as the h1 would have been. */
    const RAND = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let name = null, nameGen = 0;                  // what the wall says now, minus where
    /* measured off the clean words, not the live h1: a tear boils its
       glyphs into wider static and jolts it sideways */
    const meter = document.createElement('canvas').getContext('2d');
    function nameGeom() {
      const s = title.dataset.text, cs = getComputedStyle(title), b = title.getBoundingClientRect();
      meter.font = cs.font; meter.letterSpacing = cs.letterSpacing;
      const w = meter.measureText(s).width, mx = (b.left + b.right) / 2 - (parseFloat(title.style.translate) || 0);
      const [x0, y0] = W.screenToWall(mx - w / 2, b.top), [x1, y1] = W.screenToWall(mx + w / 2, b.bottom);
      const cells = widthOf(s);
      const sx = Math.max(1, Math.floor((x1 - x0) / cells));
      const sy = Math.max(1, Math.round(sx * (y1 - y0) / b.height * w / (x1 - x0)));
      return { sx, sy, x: Math.round((x0 + x1) / 2 - cells * sx / 2), y: Math.round((y0 + y1) / 2 - 7 * sy / 2) };
    }
    function placeName() {
      if (name) W.write('name', { ...name, ...nameGeom() });
    }
    function settleName() { name = { s: title.dataset.text, lvl: 32 }; placeName(); }
    async function speakName() {                   // resolved ← hot ← raw, like the rest
      const s = title.dataset.text, gen = ++nameGen;
      if (still) { settleName(); return; }
      for (let f = 0; f <= s.length * 2 + 1; f++) {
        if (gen !== nameGen) return;
        const k = f >> 1;
        let t = '';
        const lv = [], hu = [];
        for (let i = 0; i < s.length; i++) {
          const res = i < k, hot = !res && i < k + 3;
          t += res || s[i] === ' ' ? s[i] : pick(RAND);
          lv.push(res ? 32 : hot ? 22 : 8);
          hu.push(res || hot ? 0 : 7);
        }
        name = { s: t, lv, hu };
        placeName();
        await sleep(DECODE_MS * .6);
      }
      if (gen === nameGen) settleName();
    }
    function speakMasthead() {
      speakName();
      decodeIn(tagline, 60, 16);                   // done alongside the name, not long after it
    }

    /* ── scroll eats it ──
       walk further in and the wall takes the masthead: the name melts back
       into the rain, the tagline breaks into risers that swim up the curtain.
       come back up and it speaks them again. */
    let eaten = false;
    function checkEat() {
      if (booting) return;
      const y = scrollY, h = innerHeight;
      if (!eaten && y > h * .16) {
        eaten = true;
        nameGen++; name = null;                    // stop the name mid-decode
        if (still) W.erase('name'); else W.melt('name');
        tagline._gen = (tagline._gen || 0) + 1;
        tagline.textContent = tagline.dataset.text;
        if (!still) W.absorb(textRect(tagline));
        for (const el of mast) { el.classList.add('eaten'); el.removeAttribute('data-clear'); }
        syncInk();
      } else if (eaten && y < h * .06) {
        eaten = false;
        for (const el of mast) { el.classList.remove('eaten'); el.setAttribute('data-clear', ''); }
        syncInk();
        speakMasthead();
      }
    }

    function boot() {
      document.querySelectorAll('[data-decode]').forEach(el => { el.dataset.text = el.textContent; });
      syncInk();
      let d = 220;                                 // the section heads speak on arrival
      document.querySelectorAll('[data-decode]').forEach(el => {
        if (mast.includes(el)) return;
        decodeIn(el, d); d += 140;
      });
      const root = document.documentElement;
      if (root.classList.contains('boot') && scrollY > innerHeight * .16) {
        root.classList.remove('boot', 'gate');     // arrived mid-page: no show to miss
        try { sessionStorage.setItem('booted', '1'); } catch (e) {}
      }
      if (root.classList.contains('boot')) {
        /* the gate: the browser opens sound only after a gesture, so the show waits for one. that press is the gate's,
           not a hurry: the breach hasn't started listening yet. */
        let opened = false;
        const open = () => { if (opened) return; opened = true; root.classList.remove('gate'); runBreach(); };
        addEventListener('keydown', open); addEventListener('pointerdown', open);
      }
      else { speakMasthead(); checkEat(); }
    }
    if (document.readyState === 'loading')
      document.addEventListener('DOMContentLoaded', boot);
    else boot();
    /* the masthead is the wall's: it lags the page with it */
    const head = document.querySelector('.masthead');
    const ride = () => { head.style.translate = '0 ' + W.lag() + 'px'; };
    ride();
    addEventListener('resize', () => { ride(); syncInk(); placeName(); });
    addEventListener('scroll', () => { ride(); checkEat(); }, { passive: true });

    /* hands: the wall looks where the cursor is, a click shatters it */
    document.addEventListener('pointermove', e => { if (!still) W.look(e.clientX, e.clientY); });

    /* the tear corrupts the words it crosses: glyphs boil into static and
       resolve back. wired only to wild slices (a click, a bite) via the jolt. */
    const struckSet = new WeakSet();
    deck.tearstruck = el => {
      if (still || struckSet.has(el)) return;
      struckSet.add(el);
      const nodes = [];
      (function walk(n) {
        for (const c of n.childNodes)
          c.nodeType === 3 ? nodes.push([c, c.data]) : walk(c);
      })(el);
      const t0 = performance.now(), dur = 340;
      (function step() {
        const p = (performance.now() - t0) / dur;
        if (p >= 1 || !el.isConnected) {
          for (const [n, d] of nodes) n.data = d;
          struckSet.delete(el);
          return;
        }
        const amt = .22 * (1 - p);               // the static decays
        for (const [n, d] of nodes) {
          let s = '';
          for (let i = 0; i < d.length; i++)
            s += d[i] !== ' ' && Math.random() < amt
               ? ng() : d[i];
          n.data = s;
        }
        requestAnimationFrame(step);
      })();
    };
    document.addEventListener('pointerdown', e => {
      if (String(getSelection())) return;       // not mid-select
      const p = W.screenToWall(e.clientX, e.clientY);
      if (p[1] < W.FH) W.tear(p[0], p[1]);      // the floor below the wall doesn't break
    });
  })();
  </script>

  <script type="module" src="console.js"></script>
</body>
</html>
